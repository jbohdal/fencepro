services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fencepro
      POSTGRES_PASSWORD: fencepro
      POSTGRES_DB: fencepro_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://fencepro:fencepro@postgres:5432/fencepro_portal?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
