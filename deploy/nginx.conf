# ── EZ Biz — Nginx Configuration ──
# Serves the CRM web app, the customer portal and the API behind one domain.
#
# Before replacing the config on a running server, compare it with what is
# live:  nginx -T | less
# Certbot edits the live file, so the two can differ.

server {
    listen 80;
    server_name systemssyndicate.com www.systemssyndicate.com;

    # Redirect HTTP to HTTPS (after SSL is set up)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name systemssyndicate.com www.systemssyndicate.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/systemssyndicate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/systemssyndicate.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # File upload limit
    client_max_body_size 25M;

    # CRM web app files. Set here, at the server level, so every location
    # below that serves files from disk knows where to look.
    root /var/www/fencepro/web;

    # ── API (Express backend) ──
    # "^~" means: once a request starts with /api/, stop looking at the other
    # rules. Without it a photo or PDF served by the API (a path ending in
    # .png, .jpg, .svg ...) would be caught by a file rule and come back 404.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── Portal client (customer portal) ──
    location ^~ /portal/ {
        alias /var/www/fencepro/portal/dist/client/;
        try_files $uri $uri/ /portal/index.html;
    }

    # ── Built assets ──
    # Vite puts a content hash in every file name under /assets/, so these can
    # be cached for a long time. A new deploy produces new names.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── CRM web app (main site) ──
    # index.html must never be cached, or a browser keeps loading old code
    # after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
