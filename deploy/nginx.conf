# ── FencePro CRM — Nginx Configuration ──
# Serves both the CRM web app and Portal behind one domain

server {
    listen 80;
    server_name systemssyndicate.com www.systemssyndicate.com;

    # Redirect HTTP to HTTPS (after SSL is set up)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name systemssyndicate.com www.systemssyndicate.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/systemssyndicate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/systemssyndicate.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # File upload limit
    client_max_body_size 25M;

    # ── Portal API (Express backend) ──
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── Portal client (customer portal) ──
    location /portal/ {
        alias /var/www/fencepro/portal/dist/client/;
        try_files $uri $uri/ /portal/index.html;
    }

    # ── CRM web app (main site) ──
    location / {
        root /var/www/fencepro/web;
        try_files $uri $uri/ /index.html;
    }

    # ── Static file caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
